# This workflow will upload a Python Package to PyPI when a tag is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.2.3
      - 'v*.*.*.dev*'  # Trigger on version tags like v1.2.3.dev4
      - 'v*.*.*rc*'  # Trigger on version tags like v1.2.3.rc1

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: 3.15

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.13.7"

    - name: Install dependencies
      run: |
        uv sync --locked --group test
        uv pip freeze

    - name: Lint with pre-commit
      run: |
        uv run pre-commit run --all-files --show-diff-on-failure

    - name: Test with pytest
      run: |
        uv run pytest --cov-report term-missing --cov-fail-under=80

    - name: Check type annotations with mypy
      run: |
        uv run mypy src

  release-build:
    runs-on: ubuntu-latest
    needs:
      - smoke-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Test install release distributions
        run: |
          python -m pip install --force-reinstall dist/*.tar.gz
          python -m pip install --force-reinstall dist/*.whl

      - name: Verify installation
        run: |
          python -c "import django_windowsauthtoken"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/p/django-windowsauthtoken/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist
